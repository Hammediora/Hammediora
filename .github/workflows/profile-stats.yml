name: Generate GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch GitHub stats SVG (mirror)
        run: |
          curl -fsSL "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=hammediora&show_icons=true&theme=tokyonight&hide_border=true&cache_seconds=86400" \
            -o assets/github-stats.svg
          grep -q "<svg" assets/github-stats.svg

      - name: Fetch Top Languages SVG (mirror)
        run: |
          curl -fsSL "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=hammediora&layout=compact&theme=tokyonight&hide_border=true&cache_seconds=86400" \
            -o assets/top-langs.svg
          grep -q "<svg" assets/top-langs.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "chore: update profile stats" || echo "No changes"
          git push
