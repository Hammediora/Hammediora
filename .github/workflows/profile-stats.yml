name: Generate GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Generate GitHub stats SVG
        uses: anuraghazra/github-readme-stats@master
        with:
          username: hammediora
          theme: tokyonight
          hide_border: true
          show_icons: true
          output: assets/github-stats.svg

      - name: Generate Top languages SVG
        uses: anuraghazra/github-readme-stats@master
        with:
          username: hammediora
          theme: tokyonight
          hide_border: true
          layout: compact
          output: assets/top-langs.svg
          card: top-langs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "chore: update profile stats" || echo "No changes"
          git push
